<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI LIFE | 회원가입</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
}

body{
    background:#111936;
}

/* =========================
   PAGE
========================= */

.page{

    min-height:100vh;

    position:relative;

    overflow:hidden;

    padding-bottom:40px;

    background:
        radial-gradient(
            circle at 10% 85%,
            rgba(112,72,255,.38),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 15%,
            rgba(20,203,255,.30),
            transparent 28%
        ),

        linear-gradient(
            135deg,
            #111858 0%,
            #24349a 45%,
            #5427db 100%
        );
}

.light{
    position:fixed;
    border-radius:50%;
    filter:blur(10px);
    opacity:.5;
}

.light1{
    width:420px;
    height:420px;
    background:#653cff;
    left:-170px;
    bottom:-220px;
}

.light2{
    width:330px;
    height:330px;
    background:#12c9ff;
    right:-100px;
    top:80px;
}

.grid{

    position:fixed;
    inset:0;

    opacity:.07;

    background-image:
        linear-gradient(
            rgba(255,255,255,.7) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.7) 1px,
            transparent 1px
        );

    background-size:55px 55px;
}

/* =========================
   HEADER
========================= */

.header{

    height:76px;

    padding:0 55px;

    position:relative;

    z-index:10;

    display:flex;

    align-items:center;

    justify-content:space-between;

    color:white;
}

.logo{

    display:flex;

    align-items:center;

    gap:12px;

    font-size:22px;

    font-weight:900;
}

.logo-icon{

    width:43px;
    height:43px;

    display:grid;

    place-items:center;

    border-radius:13px;

    background:rgba(255,255,255,.15);

    border:1px solid rgba(255,255,255,.28);
}

.home-btn{

    color:white;

    text-decoration:none;

    padding:9px 17px;

    border-radius:20px;

    font-size:13px;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.30);
}

/* =========================
   SIGNUP
========================= */

.signup-wrap{

    position:relative;

    z-index:5;

    width:510px;

    max-width:92vw;

    margin:10px auto 0;
}

.signup-card{

    padding:36px 42px 32px;

    border-radius:30px;

    color:white;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.18),
            rgba(255,255,255,.08)
        );

    border:1px solid rgba(255,255,255,.30);

    backdrop-filter:blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.38),
        inset 0 1px rgba(255,255,255,.25);
}

/* 타이틀 */

.title{

    text-align:center;
}

.title-icon{

    width:65px;
    height:65px;

    margin:0 auto 15px;

    display:grid;
    place-items:center;

    border-radius:20px;

    font-size:30px;

    background:
        linear-gradient(
            135deg,
            rgba(20,202,255,.25),
            rgba(116,75,255,.30)
        );

    border:1px solid rgba(255,255,255,.25);
}

.title h1{

    font-size:27px;

    letter-spacing:-1.5px;
}

.title p{

    margin-top:7px;

    font-size:12px;

    color:rgba(255,255,255,.63);
}

/* =========================
   FORM
========================= */

.form{
    margin-top:24px;
}

.field{
    margin-bottom:13px;
}

.field label{

    display:block;

    margin-bottom:7px;

    font-size:11px;

    font-weight:800;

    color:rgba(255,255,255,.84);
}

.input-row{

    display:flex;

    gap:8px;
}

.input{

    width:100%;

    height:47px;

    padding:0 14px;

    outline:none;

    border-radius:12px;

    color:white;

    font-size:12px;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.23);

    transition:.25s;
}

.input::placeholder{
    color:rgba(255,255,255,.40);
}

.input:focus{

    background:rgba(255,255,255,.15);

    border-color:#6feaff;

    box-shadow:
        0 0 0 3px rgba(65,220,255,.10);
}

/* 중복확인 */

.check-btn{

    width:90px;

    flex-shrink:0;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.28);

    background:rgba(255,255,255,.13);

    color:white;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.check-btn:hover{

    background:rgba(255,255,255,.22);

    border-color:#7ee9ff;
}

/* =========================
   PASSWORD INFO
========================= */

.password-info{

    margin-top:6px;

    font-size:9px;

    color:rgba(255,255,255,.45);
}

/* =========================
   약관
========================= */

.agree-box{

    margin-top:19px;

    padding:15px;

    border-radius:14px;

    background:rgba(0,0,0,.10);

    border:1px solid rgba(255,255,255,.14);
}

.agree-all{

    display:flex;

    align-items:center;

    gap:8px;

    padding-bottom:11px;

    border-bottom:1px solid rgba(255,255,255,.13);

    font-size:12px;

    font-weight:900;
}

.agree-item{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:10px;

    font-size:10px;

    color:rgba(255,255,255,.66);
}

.agree-item label{

    display:flex;

    align-items:center;

    gap:7px;
}

.agree-item a{

    color:#9beeff;

    text-decoration:none;
}

input[type="checkbox"]{

    accent-color:#6657ff;
}

/* =========================
   SIGNUP BUTTON
========================= */

.signup-btn{

    width:100%;

    height:52px;

    margin-top:20px;

    border:0;

    border-radius:14px;

    color:white;

    font-size:14px;

    font-weight:900;

    cursor:pointer;

    background:
        linear-gradient(
            90deg,
            #20c8ed,
            #6657ff
        );

    box-shadow:
        0 12px 30px rgba(57,91,230,.38);

    transition:.25s;
}

.signup-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 17px 38px rgba(57,91,230,.52);
}

/* 로그인 */

.login-link{

    margin-top:17px;

    text-align:center;

    font-size:11px;

    color:rgba(255,255,255,.60);
}

.login-link a{

    margin-left:6px;

    color:#9beeff;

    text-decoration:none;

    font-weight:900;
}

/* Footer */

.footer{

    position:relative;

    z-index:5;

    margin-top:18px;

    text-align:center;

    color:rgba(255,255,255,.42);

    font-size:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        padding:0 18px;
    }

    .signup-card{
        padding:30px 23px;
    }

    .title h1{
        font-size:24px;
    }

    .check-btn{
        width:80px;
    }
}
</style>

</head>

<body>

<div class="page">

```
<div class="light light1"></div>
<div class="light light2"></div>
<div class="grid"></div>


<!-- HEADER -->

```

</div>

<script>

/* 전체 선택 */

const agreeAll =
    document.getElementById("agreeAll");

const agrees =
    document.querySelectorAll(".agree");

agreeAll.addEventListener("change", function(){

    agrees.forEach(function(check){

        check.checked =
            agreeAll.checked;

    });

});


/* 개별 선택 */

agrees.forEach(function(check){

    check.addEventListener("change", function(){

        agreeAll.checked =
            [...agrees].every(
                check => check.checked
            );

    });

});


/* 필수 약관 체크 */

document.querySelector(".form")
.addEventListener("submit", function(e){

    const required =
        document.querySelectorAll(".required");

    const allChecked =
        [...required].every(
            check => check.checked
        );

    if(!allChecked){

        e.preventDefault();

        alert("필수 약관에 동의해 주세요.");

    }

});

</script>

</html>
