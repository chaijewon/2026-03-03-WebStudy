name: JSP Servlet Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    # 프로젝트 구조에 따라 working-directory가 필요 없다면 아래 2줄을 삭제하세요.
    #defaults:
      #run:
        #working-directory: JSPLastProject

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Project Structure
        run: |
          echo "=== Current Working Directory ==="
          pwd
          echo "=== Directory Contents ==="
          ls -al
          echo "=== Checking src Structure ==="
          find src -maxdepth 3 -type d 2>/dev/null || echo "src directory not found!"

      - name: Java Version
        run: |
          java -version

      - name: Clean Build Directory
        run: |
          rm -rf build
          mkdir -p build/WEB-INF/classes

      - name: Compile Servlet
        run: |
          # 1. WEB-INF/lib 폴더 존재 여부 확인 후 JAR 경로 생성 (없어도 에러 방지)
          LIB_PATH=""
          if [ -d "src/main/webapp/WEB-INF/lib" ]; then
            LIB_PATH=$(find src/main/webapp/WEB-INF/lib -name "*.jar" 2>/dev/null | tr '\n' ':')
          fi

          # 2. 컴파일할 .java 파일 목록 탐색
          JAVA_FILES=$(find src/main/java -name "*.java" 2>/dev/null)

          # 3. .java 파일이 하나도 없을 경우 디버깅 정보 출력 후 중단
          if [ -z "$JAVA_FILES" ]; then
            echo "❌ ERROR: No Java files found in 'src/main/java'!"
            echo "현재 디렉터리 경로: $(pwd)"
            exit 1
          fi

          # 4. javac 컴파일 실행
          javac \
            -encoding UTF-8 \
            -cp "${LIB_PATH}:/home/sist/apache-tomcat-11.0.23/lib/servlet-api.jar" \
            -d build/WEB-INF/classes \
            $JAVA_FILES

      - name: Copy Web Application
        run: |
          # webapp 내용 복사
          if [ -d "src/main/webapp" ]; then
            cp -r src/main/webapp/* build/
          fi

          # resources 파일들을 classes 폴더로 복사
          if [ -d "src/main/resources" ]; then
            cp -r src/main/resources/* build/WEB-INF/classes/
          fi

      - name: Create WAR
        run: |
          cd build
          jar -cvf ../JSPLastProject.war .

      - name: Check WAR Contents
        run: |
          jar tf JSPLastProject.war | grep -E "config|properties|class" || true

      - name: Stop Tomcat
        run: |
          echo "Tomcat 종료 시도 중..."
          /home/sist/apache-tomcat-11.0.23/bin/shutdown.sh || true
          sleep 3

          # 톰캣 프로세스가 남아있을 경우 강제 종료(Kill)
          PID=$(pgrep -f "apache-tomcat-11.0.23") || true
          if [ -n "$PID" ]; then
            echo "톰캣이 완전 종료되지 않아 강제 종료합니다. (PID: $PID)"
            kill -9 $PID || true
            sleep 2
          fi

      - name: Remove Old WAR and Deployment
        run: |
          # 기존 war 및 압축 풀린 폴더 삭제
          rm -f /home/sist/apache-tomcat-11.0.23/webapps/JSPLastProject.war
          rm -rf /home/sist/apache-tomcat-11.0.23/webapps/JSPLastProject

      - name: Deploy WAR
        run: |
          cp JSPLastProject.war /home/sist/apache-tomcat-11.0.23/webapps/

      - name: Start Tomcat
        run: |
          echo "Tomcat 시작 중..."
          # GitHub Actions 프로세스 추적을 회피하여 Tomcat이 백그라운드에서 계속 유지되도록 설정
          RUNNER_TRACKING_ID="" nohup /home/sist/apache-tomcat-11.0.23/bin/startup.sh > /dev/null 2>&1 &
          sleep 5

          # 실행 여부 확인
          ps -ef | grep apache-tomcat-11.0.23 | grep -v grep
