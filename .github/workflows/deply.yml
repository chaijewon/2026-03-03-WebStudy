name: JSP Servlet Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Project Structure
        run: |
          echo "=== 현재 작업 디렉터리 ==="
          pwd
          echo "=== 프로젝트 내 .java 파일 위치 확인 ==="
          find . -name "*.java"

      - name: Java Version
        run: |
          java -version

      - name: Clean Build Directory
        run: |
          rm -rf build
          mkdir -p build/WEB-INF/classes

      - name: Compile Servlet
        run: |
          # 1. 프로젝트 내 모든 .jar 파일 자동 검색 및 Classpath 추가
          LIB_PATH=$(find . -name "*.jar" 2>/dev/null | tr '\n' ':')

          # 2. 프로젝트 내 모든 .java 파일 자동 검색
          JAVA_FILES=$(find . -name "*.java" 2>/dev/null)

          if [ -z "$JAVA_FILES" ]; then
            echo "❌ ERROR: 프로젝트 내에서 .java 파일을 찾을 수 없습니다!"
            exit 1
          fi

          echo "=== 컴파일 대상 Java 파일 ==="
          echo "$JAVA_FILES"

          # 3. javac 컴파일 실행
          javac \
            -encoding UTF-8 \
            -cp "${LIB_PATH}:/home/sist/apache-tomcat-11.0.23/lib/servlet-api.jar" \
            -d build/WEB-INF/classes \
            $JAVA_FILES

      - name: Copy Web Application & Resources
        run: |
          # webapp 및 resources 디렉터리 위치 자동 탐색 후 복사
          WEBAPP_DIR=$(find . -type d -path "*/src/main/webapp" | head -n 1)
          RESOURCES_DIR=$(find . -type d -path "*/src/main/resources" | head -n 1)

          if [ -n "$WEBAPP_DIR" ]; then
            cp -r $WEBAPP_DIR/* build/
          fi

          if [ -n "$RESOURCES_DIR" ]; then
            cp -a $RESOURCES_DIR/. build/WEB-INF/classes/
          fi

          echo "=== classes 내부 설정 파일 목록 ==="
          find build/WEB-INF/classes -type f \( -name "*.xml" -o -name "*.properties" \) || true

      - name: Create WAR
        run: |
          cd build
          jar -cvf ../JSPLastProject.war .

      - name: Check WAR Contents
        run: |
          jar tf JSPLastProject.war | grep -iE "config|properties|xml|class" || true

      - name: Stop Tomcat
        run: |
          echo "Tomcat 종료 시도 중..."
          /home/sist/apache-tomcat-11.0.23/bin/shutdown.sh || true
          sleep 3

          PID=$(pgrep -f "apache-tomcat-11.0.23") || true
          if [ -n "$PID" ]; then
            echo "톰캣 프로세스 강제 종료 (PID: $PID)"
            kill -9 $PID || true
            sleep 2
          fi

      - name: Remove Old WAR and Deployment
        run: |
          rm -rf /home/sist/apache-tomcat-11.0.23/webapps/JSPLastProject.war || true
          rm -rf /home/sist/apache-tomcat-11.0.23/webapps/JSPLastProject || true

      - name: Deploy WAR
        run: |
          cp JSPLastProject.war /home/sist/apache-tomcat-11.0.23/webapps/

      - name: Start Tomcat
        run: |
          echo "Tomcat 시작 중..."
          RUNNER_TRACKING_ID="" nohup /home/sist/apache-tomcat-11.0.23/bin/startup.sh > /dev/null 2>&1 &
          sleep 5

          ps -ef | grep apache-tomcat-11.0.23 | grep -v grep
