name: JSP Servlet Deploy

on:
  push:
    branches:
      - master

  workflow_dispatch:


jobs:
  deploy:

    runs-on: self-hosted

    defaults:
      run:
        working-directory: JSPLastProject


    steps:

      # GitHub 소스 다운로드
      - name: Checkout Source
        uses: actions/checkout@v4


      # Java 21 설치
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # Java 확인
      - name: Check Java Version
        run: |
          java -version
          javac -version


      # Build 폴더 생성
      - name: Clean Build Directory
        run: |
          rm -rf build
          mkdir -p build/WEB-INF/classes


      # Servlet 컴파일
      - name: Compile Java Source
        run: |

          LIB_PATH=$(find src/main/webapp/WEB-INF/lib -name "*.jar" | tr '\n' ':')

          javac \
          -encoding UTF-8 \
          -cp "${LIB_PATH}:/home/sist/apache-tomcat-11.0.23/lib/servlet-api.jar" \
          -d build/WEB-INF/classes \
          $(find src/main/java -name "*.java")


      # JSP / CSS / JS / WEB-INF 복사
      - name: Copy Web Application
        run: |

          cp -r src/main/webapp/* build/


      # WAR 생성
      - name: Create WAR File
        run: |

          cd build

          jar -cvf ../JSPLastProject.war .


      # 기존 Tomcat 배포 제거
      - name: Remove Old Deployment
        run: |

          rm -rf /home/sist/apache-tomcat-11.0.23/webapps/JSPLastProject

          rm -f /home/sist/apache-tomcat-11.0.23/webapps/JSPLastProject.war


      # WAR 배포
      - name: Deploy WAR
        run: |

          cp JSPLastProject.war \
          /home/sist/apache-tomcat-11.0.23/webapps/


      # Tomcat 재시작
      - name: Restart Tomcat
        run: |

          /home/sist/apache-tomcat-11.0.23/bin/shutdown.sh || true

          sleep 5

          /home/sist/apache-tomcat-11.0.23/bin/startup.sh
