<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 서비스 포스터 및 시연 영상</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .poster-container {
            width: 100%;
            max-width: 800px;

            background: #ffffff;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* 포스터 이미지 */
        .poster-part {
            width: 100%;
            display: block;
        }

        /* 동영상 영역 */
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="poster-container">

    <!-- 포스터 상단 -->
    <img
        src="part1.png"
        class="poster-part"
        alt="포스터 상단"
    >

    <!-- 2번 포스터 이미지 없음 -->
    <!-- 바로 시연 영상 -->
    <div class="video-wrapper">

        <video
            controls
            autoplay
            muted
            loop
            playsinline
        >
            <source src="시연.mp4" type="video/mp4">

            지원되지 않는 브라우저입니다.
        </video>

    </div>

    <!-- 포스터 하단 -->
    <img
        src="part3.png"
        class="poster-part"
        alt="포스터 하단"
    >

</div>

</body>
</html>
