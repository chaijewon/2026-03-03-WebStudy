<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>마이페이지</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Pretendard, sans-serif;

            color: #f8fafc;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(99,102,241,.23),
                    transparent 30%
                ),
                #070b18;
        }


        .wrapper {

            max-width: 1150px;

            margin: auto;

            padding:
                45px 20px 80px;
        }


        .header {

            margin-bottom: 25px;
        }


        .header h1 {

            font-size: 30px;

            font-weight: 900;
        }


        .header p {

            color: #64748b;

            font-size: 14px;
        }


        .profile {

            display: flex;

            align-items: center;

            gap: 20px;

            padding: 28px;

            margin-bottom: 20px;

            border-radius: 22px;

            background:
                rgba(15,23,42,.75);

            border:
                1px solid
                rgba(255,255,255,.08);

            backdrop-filter: blur(20px);
        }


        .avatar {

            width: 70px;

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #06b6d4
                );

            font-size: 28px;
        }


        .profile h3 {

            margin: 0;

            font-weight: 800;
        }


        .profile p {

            margin: 5px 0 0;

            color: #64748b;
        }


        .stats {

            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            gap: 15px;

            margin-bottom: 25px;
        }


        .stat {

            padding: 22px;

            border-radius: 18px;

            background:
                rgba(15,23,42,.75);

            border:
                1px solid
                rgba(255,255,255,.08);
        }


        .stat-label {

            color: #64748b;

            font-size: 12px;
        }


        .stat-value {

            margin-top: 7px;

            font-size: 27px;

            font-weight: 900;
        }


        .content-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }


        .card-box {

            padding: 25px;

            border-radius: 20px;

            background:
                rgba(15,23,42,.75);

            border:
                1px solid
                rgba(255,255,255,.08);
        }


        .card-box h4 {

            font-size: 18px;

            font-weight: 800;

            margin-bottom: 20px;
        }


        .menu-item {

            display: flex;

            align-items: center;

            gap: 13px;

            padding: 15px 0;

            color: #cbd5e1;

            text-decoration: none;

            border-bottom:
                1px solid
                rgba(255,255,255,.05);
        }


        .menu-item:last-child {

            border-bottom: 0;
        }


        .menu-item i {

            color: #818cf8;
        }


        .menu-item:hover {

            color: white;
        }


        @media(max-width: 800px) {

            .stats {

                grid-template-columns:
                    repeat(2,1fr);
            }

            .content-grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="wrapper">


    <div class="header">

        <h1>
            마이페이지
        </h1>

        <p>
            나의 학습 현황과 시험 결과를 확인하세요.
        </p>

    </div>


    <!-- 프로필 -->

    <div class="profile">

        <div class="avatar">

            <i class="bi bi-person-fill"></i>

        </div>


        <div>

            <h3>
                홍길동
            </h3>

            <p>
                Java • Spring Boot 개발자 과정
            </p>

        </div>

    </div>


    <!-- 통계 -->

    <div class="stats">


        <div class="stat">

            <div class="stat-label">
                수강 과정
            </div>

            <div class="stat-value">
                3
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                평균 점수
            </div>

            <div class="stat-value">
                87
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                완료 과정
            </div>

            <div class="stat-value">
                1
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                오답 문제
            </div>

            <div class="stat-value">
                12
            </div>

        </div>


    </div>


    <!-- 콘텐츠 -->

    <div class="content-grid">


        <div class="card-box">

            <h4>
                <i class="bi bi-mortarboard me-2"></i>
                학습 관리
            </h4>


            <a
                href="/course/list"
                class="menu-item">

                <i class="bi bi-book"></i>

                수강 과정

            </a>


            <a
                href="/exam/list"
                class="menu-item">

                <i class="bi bi-pencil-square"></i>

                시험 목록

            </a>


            <a
                href="/exam/wrong"
                class="menu-item">

                <i class="bi bi-journal-x"></i>

                AI 오답노트

            </a>


            <a
                href="/student/dashboard"
                class="menu-item">

                <i class="bi bi-bar-chart"></i>

                학습 통계

            </a>

        </div>


        <div class="card-box">

            <h4>
                <i class="bi bi-person me-2"></i>
                회원 관리
            </h4>


            <a
                href="/member/edit"
                class="menu-item">

                <i class="bi bi-person-gear"></i>

                회원정보 수정

            </a>


            <a
                href="/member/password"
                class="menu-item">

                <i class="bi bi-lock"></i>

                비밀번호 변경

            </a>


            <a
                href="/logout"
                class="menu-item">

                <i class="bi bi-box-arrow-right"></i>

                로그아웃

            </a>

        </div>

    </div>

</div>


</body>

</html>
