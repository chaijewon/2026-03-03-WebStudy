```html
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>로그인 | AI LIFE CAMPUS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Pretendard", sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%,
                rgba(99,102,241,.15),
                transparent 30%),
                radial-gradient(circle at 80% 80%,
                rgba(6,182,212,.12),
                transparent 30%),
                #f5f7fb;
        }

        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .login-box {
            width: 430px;
            background: white;
            border: 1px solid #e5e8ef;
            border-radius: 22px;
            padding: 45px;
            box-shadow: 0 25px 70px rgba(25,35,65,.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;
            margin: auto;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 25px;
            background: linear-gradient(
                135deg,#5b5ff7,#8b5cf6,#06b6d4
            );
        }

        .logo strong {
            display: block;
            margin-top: 15px;
            font-size: 22px;
            font-weight: 900;
        }

        .logo span {
            display: block;
            color: #8b93a5;
            font-size: 12px;
            margin-top: 4px;
        }

        .login-title {
            font-size: 25px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .login-description {
            color: #8a92a4;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 700;
        }

        .form-control {
            height: 50px;
            border-radius: 9px;
            border-color: #dfe3eb;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(91,95,247,.10);
            border-color: #686bf0;
        }

        .login-btn {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 9px;
            background: #181e36;
            color: white;
            font-weight: 800;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #2b3150;
        }

        .login-links {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
        }

        .login-links a {
            color: #737b8e;
            margin: 0 8px;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #a1a8b7;
            font-size: 11px;
        }

    </style>

</head>

<body>

<div class="login-wrap">

    <div class="login-box">

        <div class="logo">

            <div class="logo-icon">
                <i class="bi bi-stars"></i>
            </div>

            <strong>AI LIFE CAMPUS</strong>

            <span>쌍용강북교육센터</span>

        </div>


        <div class="login-title">
            로그인
        </div>

        <div class="login-description">
            AI LIFE CAMPUS 학습 서비스를 이용하세요.
        </div>


        <form th:action="@{/login}"
              method="post">

            <div class="mb-3">

                <label class="form-label">
                    아이디
                </label>

                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="아이디를 입력하세요"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    비밀번호
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="비밀번호를 입력하세요"
                       required>

            </div>


            <div class="form-check mb-3">

                <input class="form-check-input"
                       type="checkbox"
                       name="remember-me"
                       id="remember">

                <label class="form-check-label"
                       for="remember">

                    로그인 상태 유지

                </label>

            </div>


            <button type="submit"
                    class="login-btn">

                로그인

            </button>

        </form>


        <div class="login-links">

            <a href="/find/id">
                아이디 찾기
            </a>

            <a href="/find/password">
                비밀번호 찾기
            </a>

            <a href="/join">
                회원가입
            </a>

        </div>


        <div class="login-footer">

            © 2026 AI LIFE CAMPUS

        </div>

    </div>

</div>

</body>

</html>
```
